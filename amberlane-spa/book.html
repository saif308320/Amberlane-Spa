<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book | Amberlane Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section class="page-hero" style="padding:0">
    <div class="wrap page-copy">
      <p class="crumb"><a href="index.html">Home</a> / Book</p>
      <p class="kicker">Reservations</p>
      <h1>Hold a time.</h1>
    </div>
    <img src="https://images.unsplash.com/photo-1544161515-4ab6ce6db874?auto=format&fit=crop&w=1200&q=80" alt="Treatment room ready" />
  </section>
  <section>
    <div class="wrap" style="max-width:680px">
      <p class="sub">We confirm by email within a few hours on open days. Gift certificates and membership enquiries use the same form — choose the ritual field accordingly.</p>
      <form id="form">
        <div class="row2">
          <div><label>Name</label><input required name="name" placeholder="Your name" /></div>
          <div><label>Email</label><input required type="email" name="email" placeholder="you@email.com" /></div>
        </div>
        <div class="row2">
          <div><label>Preferred date</label><input required type="date" name="date" /></div>
          <div>
            <label>Preferred time</label>
            <select name="time">
              <option>Morning</option>
              <option>Afternoon</option>
              <option>Evening (Tue–Fri)</option>
            </select>
          </div>
        </div>
        <div>
          <label>Ritual</label>
          <select name="treat" id="treatSelect">
            <option>Amber Stone</option>
            <option>Rose Quartz Facial</option>
            <option>Mineral Wrap</option>
            <option>Lane Signature</option>
            <option>Quiet Glow</option>
            <option>Thermal Circuit</option>
            <option>Membership enquiry</option>
            <option>Gift certificate</option>
          </select>
        </div>
        <div>
          <label>Therapist (optional)</label>
          <select name="therapist">
            <option>No preference</option>
            <option>Mara Ellison</option>
            <option>Hana Voss</option>
            <option>Lila Chen</option>
          </select>
        </div>
        <div><label>Notes</label><textarea name="notes" rows="4" placeholder="Pressure, scent, first visit, accessibility..."></textarea></div>
        <button class="btn" type="submit">Send request</button>
        <p class="ok" id="ok">Received. We will hold a provisional time and write back shortly.</p>
      </form>
    </div>
  </section>
  <script src="js/site.js"></script>
  <script>
    const treat = new URLSearchParams(location.search).get("treat");
    if (treat) {
      const sel = document.getElementById("treatSelect");
      for (const o of sel.options) if (o.value === treat) sel.value = treat;
    }
    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      document.getElementById("ok").style.display = "block";
      e.target.reset();
    };
  </script>
</body>
</html>
